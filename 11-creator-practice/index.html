<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <div class="follower"></div>

    <main>

        <video autoplay muted loop src="https://www.pexels.com/download/video/35258785/"></video>
        <div class="layer"></div>

        <nav>
            <div class="menu">
                <div class="logo">
                    <i class="ri-film-line"></i>
                </div>
                <div class="menu-i">
                    <i class="ri-menu-line"></i>
                </div>
                <div class="close">
                    <i class="ri-close-large-line"></i>
                </div>
            </div>

            <div class="list">
                <a>Work</a>
                <a>Services</a>
                <a>Process</a>
                <a>About</a>
                <a>Book Call</a>
            </div>
        </nav>

        <section class="view1">
            <div class="texts">

                <div class="noti">
                    <h2 class="noti-h">Hurry, only 3 spots left.</h2>
                </div>
    
    
                <div class="hero-text">
                    <h1>Editing That Grows Channels.</h1>
                    <div class="para">YouTube long-form, Shorts, Reels & TikTok editing for creators who want retention,
                        watch time, and consistency.</div>
                </div>
    
    
                <div class="btns">
                    <button class="bt1">View Work</button>
                    <button class="bt2">See Pricing</button>
                </div>
    
                <div class="workedwith">
                    <div class="imgs">
                        <img src="https://plus.unsplash.com/premium_photo-1690407617542-2f210cf20d7e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8cHJvZmlsZXxlbnwwfHwwfHx8MA%3D%3D"
                            alt="">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHByb2ZpbGV8ZW58MHx8MHx8fDA%3D"
                            alt="">
                        <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fHByb2ZpbGV8ZW58MHx8MHx8fDA%3D"
                            alt="">
                        <div class="num">+95</div>
                    </div>
                    <div class="stars">
                        <i class="ri-star-fill"></i>
                        <i class="ri-star-fill"></i>
                        <i class="ri-star-fill"></i>
                        <i class="ri-star-fill"></i>
                        <i class="ri-star-fill"></i>
                        <p>Worked with 100+ Creators</p>
                    </div>
                </div>
            </div>
            <div class="video">
                <video autoplay muted loop controls src="https://framerusercontent.com/assets/t1Ti4gmACJzDwYuleC4XbdPL0.mp4"></video>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
